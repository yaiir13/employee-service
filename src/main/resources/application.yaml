spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
server:
  port: 8080
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO                                                          # default level for everything
    com.yair.guzman.employee_service: DEBUG                            # full debug for our own code
    com.yair.guzman.employee_service.repository: DEBUG                 # shows generated JPQL queries
    org.hibernate.SQL: DEBUG                                           # prints every SQL statement
    org.hibernate.orm.jdbc.bind: TRACE                                 # prints bound parameter values
    org.springframework.web.servlet.DispatcherServlet: DEBUG           # logs every incoming HTTP request
    org.springframework.transaction: DEBUG                             # logs transaction open/commit/rollback
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file:    "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx"
  file:
    name: logs/employee-service.log                                    # persistent log file next to the jar
  logback:
    rollingpolicy:
      max-file-size: 10MB                                              # rotate when a file hits 10 MB
      max-history: 30                                                  # keep last 30 rolled files
      total-size-cap: 300MB                                            # purge oldest when total exceeds 300 MB
      file-name-pattern: logs/employee-service.%d{yyyy-MM-dd}.%i.log.gz  # gzip-compressed rotated files

