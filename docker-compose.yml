services:

  employee-service:
    container_name: employee-service
    build:
      context: .
      dockerfile: Dockerfile
    image: employee-service:latest
    ports:
      - "8080:8080"               # REST API      → http://localhost:8080/api/v1/employees
                                  # Swagger UI    → http://localhost:8080/swagger-ui.html
                                  # H2 Console    → http://localhost:8080/h2-console
    environment:
      # Spring Boot relaxed binding — overrides application.yaml at runtime
      SPRING_DATASOURCE_URL: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_H2_CONSOLE_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
      # Logging overrides
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_YAIR_GUZMAN_EMPLOYEE__SERVICE: DEBUG
      LOGGING_FILE_NAME: logs/employee-service.log
    volumes:
      - ./logs:/app/logs          # persists log files on the host even after container stops
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api-docs || exit 1"]
      interval: 30s               # check every 30 s
      timeout: 5s                 # fail if no response within 5 s
      retries: 3                  # mark unhealthy after 3 consecutive failures
      start_period: 45s           # give the app 45 s to start before health checks begin
    restart: unless-stopped       # auto-restart on crash, but not if manually stopped

